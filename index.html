<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Richard Tavares">
        <meta name="description" content="Calculadora de Calorias com base na tabela TACO">
        <link rel="icon" type="image/png" href="assets/img/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
        <link rel="manifest" href="site.webmanifest" />
        <title>Calorie Calculator</title>
        <script>document.documentElement.dataset.bsTheme = localStorage.getItem('theme') || 'dark';</script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.bootstrap5.min.css" integrity="sha384-qNqaCnsmyTrYVwmqv4/4PcwMK8ZFAQnYPpVjWor+6cX6rKsPhebzu8vO2J3s+VZg" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2 p-0" href="#">
                    <img src="assets/img/logo-white.png" class="logo logo-dark" alt="Logo">
                    <img src="assets/img/logo-black.png" class="logo logo-light" alt="Logo">
                    <span class="brand-text text-gradient">Calorie Calculator</span>
                </a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
                    <i class="bi bi-moon-stars-fill"></i>
                    <div class="theme-track">
                        <div class="theme-thumb"></div>
                    </div>
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </nav>

        <main class="container flex-grow-1 my-3">

            <!-- Busca + Total integrados (sticky) -->
            <div class="card mb-3 meal-panel sticky-top">
                <div class="card-body pb-2 d-md-flex align-items-center gap-3">
                    <label for="food-search" class="form-label fw-semibold mb-1 mb-md-0 text-nowrap">Adicionar alimento</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <select id="food-search" class="form-select"></select>
                    </div>
                </div>
                <div id="meal-totals" class="d-none border-top">
                    <div class="card-body py-2">
                        <div class="small fw-semibold text-muted mb-2">Total da Refeição</div>
                        <div class="d-flex align-items-center text-center">
                            <div class="flex-fill d-none d-md-block">
                                <div class="nutrient-value"><span id="total-sodium"></span> <span class="nutrient-unit">mg</span></div>
                                <div class="nutrient-label">Sódio</div>
                            </div>
                            <div class="nutrient-sep d-none d-md-block" aria-hidden="true"></div>
                            <div class="flex-fill">
                                <div class="nutrient-value"><span id="total-lip"></span> <span class="nutrient-unit">g</span></div>
                                <div class="nutrient-label">Lipídeos</div>
                            </div>
                            <div class="nutrient-sep d-none d-md-block" aria-hidden="true"></div>
                            <div class="flex-fill d-none d-md-block">
                                <div class="nutrient-value"><span id="total-fiber"></span> <span class="nutrient-unit">g</span></div>
                                <div class="nutrient-label">Fibras</div>
                            </div>
                            <div class="nutrient-sep" aria-hidden="true"></div>
                            <div class="flex-fill">
                                <div class="nutrient-value"><span id="total-prot"></span> <span class="nutrient-unit">g</span></div>
                                <div class="nutrient-label">Proteínas</div>
                            </div>
                            <div class="nutrient-sep" aria-hidden="true"></div>
                            <div class="flex-fill">
                                <div class="nutrient-value"><span id="total-carb"></span> <span class="nutrient-unit">g</span></div>
                                <div class="nutrient-label">Carboidratos</div>
                            </div>
                            <div class="nutrient-sep" aria-hidden="true"></div>
                            <div class="flex-fill">
                                <div class="nutrient-value fw-bold text-gradient"><span id="total-cal"></span> <span class="nutrient-unit">kcal</span></div>
                                <div class="nutrient-label">Calorias</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de alimentos -->
            <div id="food-list">
                <p class="text-center text-muted py-3">Nenhum alimento adicionado</p>
            </div>

        </main>

        <footer class="footer py-3">
            <div class="container d-flex align-items-center justify-content-between">
                <span class="small">&copy; 2026 Richard Tavares</span>
                <div class="d-flex align-items-center gap-3">
                    <a href="https://github.com/RichardTavares" class="social-link" aria-label="GitHub" target="_blank" rel="noopener">
                        <i class="bi bi-github"></i>
                    </a>
                    <a href="#" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener">
                        <i class="bi bi-linkedin"></i>
                    </a>
                    <a href="mailto:richard.jstavares@gmail.com" class="social-link" aria-label="Email">
                        <i class="bi bi-envelope-fill"></i>
                    </a>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js" integrity="sha384-OgdLxftmuTHirLYFRbvXsKJxgSVqpU4ZdZ07tRiBC+Z4GjtQ5Al0uika0gtMfeQw" crossorigin="anonymous"></script>
        <script type="module" src="assets/js/app.js"></script>
    </body>

</html>
